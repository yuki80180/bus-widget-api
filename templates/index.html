<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f7f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111719" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="KIT Bus">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <link rel="icon" href="{{ url_for('static', filename='app-icon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <title>KIT Bus</title>
    <style>
        :root {
            color-scheme: light dark;
            --page: #f4f7f8;
            --surface: #ffffff;
            --surface-subtle: #e8eef0;
            --text: #102126;
            --muted: #617278;
            --border: #d5dfe2;
            --accent: #006b5f;
            --accent-strong: #00564d;
            --accent-soft: #d9f0eb;
            --focus: #147dce;
            --danger: #a92e2e;
            --shadow: 0 10px 32px rgba(19, 42, 48, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--page);
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--page);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }

        button {
            font: inherit;
        }

        button:focus-visible {
            outline: 3px solid color-mix(in srgb, var(--focus) 60%, transparent);
            outline-offset: 2px;
        }

        .app-shell {
            width: min(100%, 680px);
            min-height: 100vh;
            margin: 0 auto;
            padding: calc(18px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 48px;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border-radius: 7px;
            background: var(--accent);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            font-size: 21px;
            line-height: 1.2;
        }

        .refresh-button {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 0 14px;
            background: var(--surface);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
        }

        .refresh-button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        .refresh-icon {
            font-size: 20px;
            line-height: 1;
        }

        .direction-tabs {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 4px;
            padding: 4px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-subtle);
        }

        .direction-tab {
            min-height: 46px;
            border: 0;
            border-radius: 6px;
            padding: 6px;
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
            line-height: 1.25;
            cursor: pointer;
        }

        .direction-tab[aria-pressed="true"] {
            background: var(--surface);
            color: var(--accent-strong);
            box-shadow: 0 1px 4px rgba(19, 42, 48, 0.12);
        }

        .route-heading {
            margin: 28px 0 16px;
        }

        .route-kicker {
            margin: 0 0 5px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .route-title {
            display: flex;
            align-items: baseline;
            gap: 9px;
            margin: 0;
            font-size: clamp(24px, 8vw, 34px);
            line-height: 1.2;
        }

        .route-arrow {
            color: var(--accent);
            font-size: 0.8em;
        }

        .panel {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .loading-panel,
        .message-panel {
            display: grid;
            min-height: 330px;
            place-items: center;
            padding: 32px 24px;
            text-align: center;
        }

        .message-title {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .message-text {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .retry-button {
            min-height: 44px;
            margin-top: 20px;
            border: 0;
            border-radius: 7px;
            padding: 0 18px;
            background: var(--accent);
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }

        .next-bus {
            padding: 24px;
        }

        .section-label {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
        }

        .departure-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-top: 8px;
        }

        .departure-time {
            margin: 0;
            font-size: clamp(68px, 22vw, 104px);
            font-variant-numeric: tabular-nums;
            font-weight: 780;
            line-height: 0.95;
        }

        .remaining-time {
            flex-shrink: 0;
            margin: 0 0 8px;
            border-radius: 6px;
            padding: 7px 10px;
            background: var(--accent-soft);
            color: var(--accent-strong);
            font-size: 17px;
            font-weight: 800;
            white-space: nowrap;
        }

        .bus-details {
            display: grid;
            gap: 7px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .line-number {
            font-size: 17px;
            font-weight: 800;
        }

        .destination {
            font-size: 16px;
            font-weight: 650;
        }

        .stop {
            color: var(--muted);
            font-size: 14px;
        }

        .following {
            margin-top: 14px;
            padding: 18px 20px;
        }

        .following-list {
            display: grid;
            margin: 12px 0 0;
            padding: 0;
            list-style: none;
        }

        .following-item {
            display: grid;
            grid-template-columns: 68px minmax(0, 1fr) auto;
            min-height: 58px;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border);
        }

        .following-item:first-child {
            border-top: 0;
        }

        .following-time {
            font-size: 25px;
            font-variant-numeric: tabular-nums;
            font-weight: 750;
        }

        .following-line {
            min-width: 0;
            overflow: hidden;
            color: var(--muted);
            font-size: 13px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .following-remaining {
            color: var(--accent-strong);
            font-size: 13px;
            font-weight: 750;
            white-space: nowrap;
        }

        .updated-at {
            margin: 16px 2px 0;
            color: var(--muted);
            font-size: 12px;
            text-align: right;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 390px) {
            .app-shell {
                padding-right: max(14px, env(safe-area-inset-right));
                padding-left: max(14px, env(safe-area-inset-left));
            }

            .next-bus {
                padding: 20px;
            }

            .departure-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            .remaining-time {
                margin-bottom: 0;
            }

            .following-item {
                grid-template-columns: 64px minmax(0, 1fr);
            }

            .following-remaining {
                grid-column: 2;
                margin-top: -10px;
                padding-bottom: 8px;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --page: #111719;
                --surface: #192225;
                --surface-subtle: #202c30;
                --text: #edf4f5;
                --muted: #a6b6ba;
                --border: #354449;
                --accent: #46c7b6;
                --accent-strong: #77dfd0;
                --accent-soft: #173f3a;
                --focus: #57aeea;
                --danger: #ff8d8d;
                --shadow: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">KIT</span>
                <h1>KIT Bus</h1>
            </div>
            <button id="refresh-button" class="refresh-button" type="button" title="最新情報に更新">
                <span class="refresh-icon" aria-hidden="true">↻</span>
                <span>更新</span>
            </button>
        </header>

        <div class="direction-tabs" role="group" aria-label="行き先">
            <button class="direction-tab" type="button" aria-pressed="true" data-direction="to_uni">KIT行き</button>
            <button class="direction-tab" type="button" aria-pressed="false" data-direction="to_station">金沢駅行き</button>
            <button class="direction-tab" type="button" aria-pressed="false" data-direction="to_nakahashi">中橋行き</button>
        </div>

        <section aria-live="polite" aria-busy="true" id="bus-section">
            <div class="route-heading">
                <p class="route-kicker">現在の方向</p>
                <h2 class="route-title">
                    <span id="route-from">金沢駅・中橋方面</span>
                    <span class="route-arrow" aria-hidden="true">→</span>
                    <span id="route-to">KIT</span>
                </h2>
            </div>

            <div id="loading-state" class="panel loading-panel">
                <p class="message-text">バス情報を取得しています</p>
            </div>

            <div id="success-state" hidden>
                <article class="panel next-bus">
                    <p class="section-label">次のバス</p>
                    <div class="departure-row">
                        <p id="next-time" class="departure-time">--:--</p>
                        <p id="next-remaining" class="remaining-time">--</p>
                    </div>
                    <div class="bus-details">
                        <div id="next-line" class="line-number"></div>
                        <div id="next-destination" class="destination"></div>
                        <div id="next-stop" class="stop"></div>
                    </div>
                </article>

                <section id="following-panel" class="panel following">
                    <p class="section-label">このあとのバス</p>
                    <ol id="following-list" class="following-list"></ol>
                </section>
            </div>

            <div id="end-state" class="panel message-panel" hidden>
                <div>
                    <p class="message-title">本日の運行は終了しました</p>
                    <p class="message-text">次の運行日に、最新の時刻をご確認ください。</p>
                </div>
            </div>

            <div id="error-state" class="panel message-panel" hidden>
                <div>
                    <p class="message-title">バス情報を取得できませんでした</p>
                    <p class="message-text">通信状態を確認して、もう一度お試しください。</p>
                    <button id="retry-button" class="retry-button" type="button">再読み込み</button>
                </div>
            </div>

            <p id="updated-at" class="updated-at" hidden>最終更新 --:--</p>
            <p id="screen-reader-status" class="visually-hidden" role="status"></p>
        </section>
    </main>

    <script>
        const directions = {
            to_uni: { from: '金沢駅・中橋方面', to: 'KIT' },
            to_station: { from: 'KIT', to: '金沢駅' },
            to_nakahashi: { from: 'KIT', to: '中橋' }
        };

        const state = {
            direction: 'to_uni',
            requestId: 0,
            controller: null,
            refreshIntervalId: null
        };

        const elements = {
            busSection: document.getElementById('bus-section'),
            routeFrom: document.getElementById('route-from'),
            routeTo: document.getElementById('route-to'),
            loading: document.getElementById('loading-state'),
            success: document.getElementById('success-state'),
            end: document.getElementById('end-state'),
            error: document.getElementById('error-state'),
            nextTime: document.getElementById('next-time'),
            nextRemaining: document.getElementById('next-remaining'),
            nextLine: document.getElementById('next-line'),
            nextDestination: document.getElementById('next-destination'),
            nextStop: document.getElementById('next-stop'),
            followingPanel: document.getElementById('following-panel'),
            followingList: document.getElementById('following-list'),
            updatedAt: document.getElementById('updated-at'),
            status: document.getElementById('screen-reader-status'),
            refreshButton: document.getElementById('refresh-button'),
            retryButton: document.getElementById('retry-button')
        };

        function setView(view) {
            elements.loading.hidden = view !== 'loading';
            elements.success.hidden = view !== 'success';
            elements.end.hidden = view !== 'end';
            elements.error.hidden = view !== 'error';
            elements.busSection.setAttribute('aria-busy', String(view === 'loading'));
        }

        function formatRemaining(minutes) {
            if (!Number.isInteger(minutes) || minutes <= 1) {
                return 'まもなく';
            }
            return `あと${minutes}分`;
        }

        function formatLine(bus) {
            if (bus.line_number) {
                return `${bus.line_number}系統`;
            }
            return bus.line || '系統情報なし';
        }

        function formatStop(bus) {
            const stopName = bus.stop_name || bus.stop;
            if (!stopName) {
                return 'のりば情報なし';
            }
            return bus.stop ? `${bus.stop}のりば・${stopName}` : stopName;
        }

        function updateDirectionHeading(detail) {
            const fallback = directions[state.direction];
            elements.routeFrom.textContent = detail?.from || fallback.from;
            elements.routeTo.textContent = detail?.to || fallback.to;
        }

        function createFollowingItem(bus) {
            const item = document.createElement('li');
            item.className = 'following-item';

            const time = document.createElement('span');
            time.className = 'following-time';
            time.textContent = bus.time || '--:--';

            const line = document.createElement('span');
            line.className = 'following-line';
            line.textContent = formatLine(bus);

            const remaining = document.createElement('span');
            remaining.className = 'following-remaining';
            remaining.textContent = formatRemaining(bus.minutes_until);

            item.append(time, line, remaining);
            return item;
        }

        function renderSuccess(data) {
            const [nextBus, ...followingBuses] = data.buses;
            updateDirectionHeading(data.direction_detail);
            elements.nextTime.textContent = nextBus.time || '--:--';
            elements.nextRemaining.textContent = formatRemaining(nextBus.minutes_until);
            elements.nextLine.textContent = formatLine(nextBus);
            elements.nextDestination.textContent = data.direction_detail?.destination || '';
            elements.nextStop.textContent = formatStop(nextBus);

            elements.followingList.replaceChildren(...followingBuses.map(createFollowingItem));
            elements.followingPanel.hidden = followingBuses.length === 0;
            elements.status.textContent = `次のバスは${elements.nextTime.textContent}、${elements.nextRemaining.textContent}です`;
            setView('success');
        }

        function markUpdated() {
            const time = new Intl.DateTimeFormat('ja-JP', {
                hour: '2-digit',
                minute: '2-digit'
            }).format(new Date());
            elements.updatedAt.textContent = `最終更新 ${time}`;
            elements.updatedAt.hidden = false;
        }

        async function loadBuses() {
            if (state.controller) {
                state.controller.abort();
            }

            const requestId = ++state.requestId;
            const controller = new AbortController();
            state.controller = controller;
            setView('loading');
            elements.refreshButton.disabled = true;
            elements.status.textContent = 'バス情報を更新しています';

            try {
                const response = await fetch(`/api/next_bus?dir=${encodeURIComponent(state.direction)}`, {
                    cache: 'no-store',
                    headers: { Accept: 'application/json' },
                    signal: controller.signal
                });
                const data = await response.json();

                if (requestId !== state.requestId) {
                    return;
                }
                if (!response.ok || data.status === 'error') {
                    throw new Error('API response error');
                }

                markUpdated();
                updateDirectionHeading(data.direction_detail);
                if (data.status === 'success' && Array.isArray(data.buses) && data.buses.length > 0) {
                    renderSuccess(data);
                } else if (data.status === 'end') {
                    elements.status.textContent = '本日の運行は終了しました';
                    setView('end');
                } else {
                    throw new Error('Unexpected API response');
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    return;
                }
                if (requestId === state.requestId) {
                    elements.status.textContent = 'バス情報を取得できませんでした';
                    setView('error');
                }
            } finally {
                if (requestId === state.requestId) {
                    state.controller = null;
                    elements.refreshButton.disabled = false;
                }
            }
        }

        function stopAutoRefresh() {
            if (state.refreshIntervalId !== null) {
                window.clearInterval(state.refreshIntervalId);
                state.refreshIntervalId = null;
            }
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            if (!document.hidden) {
                state.refreshIntervalId = window.setInterval(loadBuses, 60000);
            }
        }

        document.querySelectorAll('.direction-tab').forEach((tab) => {
            tab.addEventListener('click', () => {
                if (tab.dataset.direction === state.direction) {
                    return;
                }
                state.direction = tab.dataset.direction;
                document.querySelectorAll('.direction-tab').forEach((candidate) => {
                    candidate.setAttribute('aria-pressed', String(candidate === tab));
                });
                updateDirectionHeading();
                loadBuses();
            });
        });

        elements.refreshButton.addEventListener('click', loadBuses);
        elements.retryButton.addEventListener('click', loadBuses);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopAutoRefresh();
                if (state.controller) {
                    state.controller.abort();
                }
                return;
            }

            loadBuses();
            startAutoRefresh();
        });
        loadBuses();
        startAutoRefresh();
    </script>
</body>
</html>
